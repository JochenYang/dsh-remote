name: Release

# Builds and packs both packages when a version tag is pushed, then creates
# (or updates) the matching GitHub Release with the tgz asset and the
# package's CHANGELOG section as notes.
#
# Supported tag shapes (mirrors the current release history):
#   dsh-remote@<ver>      -> "dsh-remote <ver>"        (asset dsh-remote-<ver>.tgz)
#   relay-server@<ver>    -> "dsh-remote-relay <ver>"  (asset dsh-remote-relay-<ver>.tgz)
#   v<ver>                -> legacy alias for dsh-remote

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack dsh-remote
        working-directory: dsh-remote
        run: pnpm run pack

      - name: Pack relay-server
        working-directory: relay-server
        run: pnpm run pack

      - name: Prepare release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "${TAG}" in
            dsh-remote@*)
              PKG=dsh-remote; SECTION=dsh-remote
              VER="${TAG#dsh-remote@}"
              NAME="dsh-remote ${VER}"
              ASSET="dsh-remote/dsh-remote-${VER}.tgz"
              INSTALL="\`\`\`
dsh plugin --profile web add ./dsh-remote-${VER}.tgz
\`\`\`

Restart DSH after installing."
              ;;
            relay-server@*)
              PKG=relay-server; SECTION=relay-server
              VER="${TAG#relay-server@}"
              NAME="dsh-remote-relay ${VER}"
              ASSET="relay-server/dsh-remote-relay-${VER}.tgz"
              INSTALL="Deploy per the relay-server README (systemd + caddy example included)."
              ;;
            v*)
              # Legacy alias: v0.1.10 etc. targeted the dsh-remote plugin.
              PKG=dsh-remote; SECTION=dsh-remote
              VER="${TAG#v}"
              NAME="dsh-remote ${VER}"
              ASSET="dsh-remote/dsh-remote-${VER}.tgz"
              INSTALL="\`\`\`
dsh plugin --profile web add ./dsh-remote-${VER}.tgz
\`\`\`

Restart DSH after installing."
              ;;
            *)
              echo "unknown tag shape: ${TAG}" >&2
              exit 1
              ;;
          esac

          BODY="$(awk -v sec="${SECTION}" -v ver="${VER}" '
            /^## / { active = ($0 == "## " sec); next }
            !active { next }
            /^### / { if (grab) exit; grab = ($0 ~ "^### " ver "($| -)"); next }
            grab { print }
          ' CHANGELOG.md)"

          printf '%s\n\n---\n\n**Install** (${PKG}): ${INSTALL}\n' "${BODY}" > NOTES.md
          printf 'PKG=%s\nNAME=%s\nASSET=%s\n' "${PKG}" "${NAME}" "${ASSET}" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${NAME}" --notes-file NOTES.md
            gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSET}" --title "${NAME}" --notes-file NOTES.md
          fi