name: CI

on:
  push:
    branches: [main]
  pull_request:

# Typecheck stays a local gate: the tsconfig @deepseek-ai/* mappings
# resolve into build outputs (lib/types) of a deepseek-harness checkout
# beside this repository, which a fresh CI checkout cannot produce
# without building the upstream monorepo.

jobs:
  dsh-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh-remote/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: dsh-remote
      - name: Build
        run: pnpm build && pnpm build:client
        working-directory: dsh-remote
      - name: Syntax check
        run: node --check lib/index.js
        working-directory: dsh-remote

  relay-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-server/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: relay-server
      - name: Build
        run: pnpm build
        working-directory: relay-server
      - name: Syntax check
        run: |
          node --check dist/index.js
          node --check dist/cli.js
        working-directory: relay-server
