name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dsh-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      # Type mappings in dsh-remote/tsconfig*.json point at a
      # deepseek-harness checkout beside this repository
      # (`../../deepseek-harness`), so CI checks out the public
      # upstream there (shallow — types only).
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness
          depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/dsh-remote/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: repo/dsh-remote
      - name: Build
        run: pnpm build && pnpm build:client
        working-directory: repo/dsh-remote
      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:client
        working-directory: repo/dsh-remote
      - name: Syntax check
        run: node --check lib/index.js
        working-directory: repo/dsh-remote

  relay-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay-server/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: relay-server
      - name: Build
        run: pnpm build
        working-directory: relay-server
      - name: Typecheck
        run: pnpm typecheck
        working-directory: relay-server
      - name: Syntax check
        run: |
          node --check dist/index.js
          node --check dist/cli.js
        working-directory: relay-server
